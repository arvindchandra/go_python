name: Precheckin Validator

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  precheckin-validator:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml pytest

      - name: Prepare artifacts directory
        run: mkdir -p .artifacts

      - name: Run precheckin validator
        run: |
          go run ./cmd/validator run --config validator.yaml --output .artifacts

      - name: Collect Docker logs on failure
        if: failure()
        run: |
          docker compose -f sample_project/docker-compose.test.yml logs > .artifacts/docker-logs.txt || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: precheckin-results
          path: .artifacts
